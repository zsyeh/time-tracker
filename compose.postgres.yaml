services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-learning_os}"
      POSTGRES_USER: "${POSTGRES_USER:-learning_os}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learning_os} -d ${POSTGRES_DB:-learning_os}"]
      interval: 5s
      timeout: 4s
      retries: 20

  web:
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-learning_os}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-learning_os}"
    depends_on:
      db:
        condition: service_healthy

  mcp:
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-learning_os}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-learning_os}"

volumes:
  postgres_data:
