services:
  web:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/db.sqlite3
      DJANGO_DEBUG: "false"
    ports:
      - "${TRACKER_PORT:-8000}:8000"
    volumes:
      - tracker_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/admin/login/', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(request, timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  mcp:
    build:
      context: .
    profiles:
      - mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/db.sqlite3
      MCP_HOST: 0.0.0.0
    command:
      - python
      - manage.py
      - runmcp
    ports:
      - "127.0.0.1:${MCP_PORT:-8001}:8001"
    volumes:
      - tracker_data:/app/data
    depends_on:
      web:
        condition: service_healthy

volumes:
  tracker_data:
