<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>学习启动结果</title>
    <style>
        *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;background:#07110d;color:#edfdf4;font:16px/1.6 system-ui,sans-serif}.card{width:min(440px,calc(100% - 32px));padding:36px;background:#102019;border:1px solid #285b42;border-radius:24px;box-shadow:0 30px 80px #0008}.dot{width:13px;height:13px;background:{% if conflict %}#fb7185{% else %}#5ee19c{% endif %};border-radius:50%;box-shadow:0 0 22px currentColor}h1{font-size:30px;margin:20px 0 8px}p{color:#a6c8b6}.subject{color:#80f0b5;font-size:22px;font-weight:800}.time{font-variant-numeric:tabular-nums}
    </style>
</head>
<body><main class="card"><div class="dot"></div>{% if conflict %}<h1>已有其他科目进行中</h1><p>为避免覆盖，未启动新的学习。</p>{% else %}<h1>{% if reused %}学习已经在进行{% else %}学习已开始{% endif %}</h1><p class="subject">{{ subject }}</p><p class="time">开始于 {{ started_at|date:"H:i" }}</p>{% endif %}</main></body>
</html>
