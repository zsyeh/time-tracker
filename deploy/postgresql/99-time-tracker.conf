# Conservative PostgreSQL 15 settings for the measured 2 GiB Time Tracker VPS.
#
# This is intentionally not a generic PostgreSQL preset. See
# docs/postgresql-tuning.md for the hardware/load baseline and rollback steps.
# Only settings that differ from the Debian 12 PostgreSQL 15 defaults are active.

# Two synchronous Gunicorn workers + one MCP process normally need three
# persistent connections. 17 non-superuser slots remain after PostgreSQL's
# default three reserved superuser slots.
max_connections = 20

# work_mem is per sort/hash node, not a cluster-wide budget.
work_mem = '2MB'
maintenance_work_mem = '32MB'

# Planner estimate only; this does not reserve or allocate 768 MB.
effective_cache_size = '768MB'

# Per backend. This limits damage from an accidental large sort/hash spill.
temp_file_limit = '128MB'

# Low-overhead query evidence for later tuning. A smaller statement table keeps
# the shared-memory footprint appropriate for this small application.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 1000
pg_stat_statements.track = 'top'
