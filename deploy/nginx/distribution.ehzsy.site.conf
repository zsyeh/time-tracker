server {
    listen 80;
    listen [::]:80;
    server_name app.ehzsy.site dockerhub.ehzsy.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.ehzsy.site;

    ssl_certificate /etc/letsencrypt/live/time-tracker-distribution.ehzsy.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/time-tracker-distribution.ehzsy.site/privkey.pem;
    root /var/www/time-tracker-app;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    location /install/ {
        default_type text/x-shellscript;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location /files/ {
        default_type text/plain;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dockerhub.ehzsy.site;

    ssl_certificate /etc/letsencrypt/live/time-tracker-distribution.ehzsy.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/time-tracker-distribution.ehzsy.site/privkey.pem;

    return 302 https://hub.docker.com/r/zsyeh/time-tracker$request_uri;
}
