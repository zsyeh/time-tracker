# Public application metadata only; never cache learning data or auth responses.
# Install deploy/pwa/* into /var/www/time-tracker-pwa before enabling this include.
location = /manifest.webmanifest {
    alias /var/www/time-tracker-pwa/manifest.webmanifest;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}
location ^~ /pwa/ {
    alias /var/www/time-tracker-pwa/;
    autoindex off;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}
