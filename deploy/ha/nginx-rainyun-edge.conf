# RainYun edge only. It must not run Django or PostgreSQL for this application.
# Every request, including reads that may touch a Django session, is proxied to
# the sole writer/application node at 47.95.10.128.
upstream time_tracker_47_tls {
    server 47.95.10.128:443;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name timer.ehzsy.site;
    ssl_certificate /etc/letsencrypt/live/ehzsy.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ehzsy.site/privkey.pem;

    location / {
        proxy_pass https://time_tracker_47_tls;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name timer.ehzsy.site;
        proxy_set_header Host timer.ehzsy.site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Time-Tracker-Edge rainyun;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }
}

