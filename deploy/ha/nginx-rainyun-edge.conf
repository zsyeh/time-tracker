# RainYun edge only. It must not run Django or PostgreSQL for this application.
# Every request, including reads that may touch a Django session, is proxied to
# the sole writer/application node at 47.95.10.128.
upstream time_tracker_47_tls {
    server 47.95.10.128:443;
    keepalive 32;
}

# Deliberately excludes URI, query string, token, IP and Cookie.
log_format learning_asset_metrics '$time_iso8601 $status $sent_http_x_learning_asset_cache $body_bytes_sent';
map $uri $learning_share_rate_key {
    default $binary_remote_addr;
    ~^/share/learning/([A-Za-z0-9_-]+)/ $host:$1;
}
limit_req_zone $learning_share_rate_key zone=learning_share_read:10m rate=240r/m;

server {
    listen 443 ssl http2;
    server_name timer.ehzsy.site;
    ssl_certificate /etc/letsencrypt/live/ehzsy.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ehzsy.site/privkey.pem;

    location / {
        proxy_pass https://time_tracker_47_tls;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name timer.ehzsy.site;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_set_header Host timer.ehzsy.site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Time-Tracker-Edge rainyun;
        proxy_set_header X-Time-Tracker-Asset-Origin 0;
        proxy_set_header Cookie "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }
}

server {
    listen 443 ssl http2;
    server_name drill.ehzsy.site;
    ssl_certificate /etc/letsencrypt/live/drill.ehzsy.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drill.ehzsy.site/privkey.pem;

    location ^~ /share/learning/ {
        access_log off;
        proxy_cache off;
        limit_req zone=learning_share_read burst=480 nodelay;
        limit_req_status 429;
        proxy_pass https://time_tracker_47_tls;
        proxy_ssl_server_name on;
        proxy_ssl_name drill.ehzsy.site;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_set_header Host drill.ehzsy.site;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Time-Tracker-Edge rainyun;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location ~ "^/__learning_asset_cache/drill/[0-9]+/(?<asset_hash>[a-f0-9]{64})$" {
        internal;
        root /var/cache/time-tracker;
        try_files $uri @drill_learning_asset_origin;
        etag off;
        default_type image/png;
        add_header ETag "\"$asset_hash\"" always;
        add_header Cache-Control "private, no-store" always;
        add_header X-Learning-Asset-Cache hit always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy no-referrer always;
        access_log /var/log/nginx/learning-asset-metrics.log learning_asset_metrics;
    }

    location @drill_learning_asset_origin {
        internal;
        proxy_cache off;
        proxy_pass https://time_tracker_47_tls$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name drill.ehzsy.site;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_set_header Host drill.ehzsy.site;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Time-Tracker-Edge rainyun;
        proxy_set_header X-Time-Tracker-Asset-Origin 1;
        proxy_set_header Cookie "";
        add_header X-Learning-Asset-Cache miss always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy no-referrer always;
        access_log /var/log/nginx/learning-asset-metrics.log learning_asset_metrics;
    }

    location / {
        proxy_pass https://time_tracker_47_tls;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name drill.ehzsy.site;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_set_header Host drill.ehzsy.site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Time-Tracker-Edge rainyun;
        proxy_set_header X-Time-Tracker-Asset-Origin 0;
        proxy_set_header Cookie "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }
}

