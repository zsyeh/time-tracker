map $host $time_tracker_ha_canonical_host {
    default timer.ehzsy.site;
    drill.47-95-10-128.sslip.io drill.ehzsy.site;
    ei.47-95-10-128.sslip.io ei.ehzsy.site;
}

map $cookie_time_tracker_ha_site $time_tracker_ha_path_host {
    default timer.ehzsy.site;
    drill drill.ehzsy.site;
    ei ei.ehzsy.site;
}

map $cookie_time_tracker_ha_site $time_tracker_ha_path_prefix {
    default "";
    drill /drill;
    ei /ei;
}

server {
    listen 443 ssl default_server;
    server_name 47.95.10.128;
    ssl_certificate /etc/letsencrypt/live/47.95.10.128/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47.95.10.128/privkey.pem;
    client_max_body_size 4m;
    include /etc/nginx/time-tracker-ha/pwa.conf;

    location = / {
        add_header Set-Cookie "time_tracker_ha_site=timer; Path=/; Max-Age=2592000; Secure; SameSite=Lax" always;
        proxy_pass http://127.0.0.1:18000;
        include /etc/nginx/time-tracker-ha/proxy-promoted-common.conf;
        include /etc/nginx/time-tracker-ha/proxy-ip-path-rewrites.conf;
        proxy_set_header Host timer.ehzsy.site;
    }
    location = /drill {
        add_header Set-Cookie "time_tracker_ha_site=drill; Path=/; Max-Age=2592000; Secure; SameSite=Lax" always;
        return 302 /drill/practice;
    }
    location = /ei {
        add_header Set-Cookie "time_tracker_ha_site=ei; Path=/; Max-Age=2592000; Secure; SameSite=Lax" always;
        return 302 /ei/practice;
    }
    location ^~ /drill/share/learning/ {
        access_log off;
        rewrite ^/drill(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:18000;
        include /etc/nginx/time-tracker-ha/proxy-promoted-common.conf;
        proxy_set_header Host drill.ehzsy.site;
        proxy_set_header X-Forwarded-Prefix /drill;
    }
    location ^~ /ei/share/learning/ {
        access_log off;
        rewrite ^/ei(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:18000;
        include /etc/nginx/time-tracker-ha/proxy-promoted-common.conf;
        proxy_set_header Host ei.ehzsy.site;
        proxy_set_header X-Forwarded-Prefix /ei;
    }
    location ^~ /drill/ {
        rewrite ^/drill(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:18000;
        include /etc/nginx/time-tracker-ha/proxy-promoted-common.conf;
        proxy_set_header Host drill.ehzsy.site;
        proxy_set_header X-Forwarded-Prefix /drill;
        proxy_set_header X-Time-Tracker-External-Host $host;
        proxy_redirect https://drill.ehzsy.site/ /drill/;
        proxy_redirect https://timer.ehzsy.site/ /;
        proxy_redirect / /drill/;
    }
    location ^~ /ei/ {
        rewrite ^/ei(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:18000;
        include /etc/nginx/time-tracker-ha/proxy-promoted-common.conf;
        proxy_set_header Host ei.ehzsy.site;
        proxy_set_header X-Forwarded-Prefix /ei;
        proxy_set_header X-Time-Tracker-External-Host $host;
        proxy_redirect https://ei.ehzsy.site/ /ei/;
        proxy_redirect https://timer.ehzsy.site/ /;
        proxy_redirect / /ei/;
    }
    location ^~ /accounts/ {
        proxy_pass http://127.0.0.1:18000;
        include /etc/nginx/time-tracker-ha/proxy-promoted-common.conf;
        include /etc/nginx/time-tracker-ha/proxy-ip-path-rewrites.conf;
        proxy_set_header Host timer.ehzsy.site;
        proxy_set_header X-Time-Tracker-External-Host $host;
    }
    location = /ip-auth/start {
        proxy_pass http://127.0.0.1:18000;
        include /etc/nginx/time-tracker-ha/proxy-promoted-common.conf;
        proxy_set_header Host timer.ehzsy.site;
        proxy_set_header X-Time-Tracker-External-Host $host;
    }
    location = /ip-auth/complete {
        proxy_pass http://127.0.0.1:18000;
        include /etc/nginx/time-tracker-ha/proxy-promoted-common.conf;
        proxy_set_header Host timer.ehzsy.site;
        proxy_set_header X-Time-Tracker-External-Host $host;
    }
    location = /drill-auth/start {
        proxy_pass http://127.0.0.1:18000;
        include /etc/nginx/time-tracker-ha/proxy-promoted-common.conf;
        include /etc/nginx/time-tracker-ha/proxy-ip-path-rewrites.conf;
        proxy_set_header Host timer.ehzsy.site;
    }
    location ^~ /drill-auth/complete/ {
        proxy_pass http://127.0.0.1:18000;
        include /etc/nginx/time-tracker-ha/proxy-promoted-common.conf;
        proxy_set_header Host $time_tracker_ha_path_host;
        proxy_redirect ~^(/.*)$ ${time_tracker_ha_path_prefix}$1;
    }
    location = /ha/primary-available { return 302 /; }
    location / {
        proxy_pass http://127.0.0.1:18000;
        include /etc/nginx/time-tracker-ha/proxy-promoted-common.conf;
        include /etc/nginx/time-tracker-ha/proxy-ip-path-rewrites.conf;
        proxy_set_header Host $time_tracker_ha_path_host;
        proxy_set_header X-Time-Tracker-External-Host $host;
    }
}

server {
    listen 443 ssl;
    server_name timer.47-95-10-128.sslip.io drill.47-95-10-128.sslip.io ei.47-95-10-128.sslip.io;
    ssl_certificate /etc/letsencrypt/live/time-tracker-ha-sslip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/time-tracker-ha-sslip/privkey.pem;
    client_max_body_size 4m;
    include /etc/nginx/time-tracker-ha/pwa.conf;
    location / {
        proxy_pass http://127.0.0.1:18000;
        include /etc/nginx/time-tracker-ha/proxy-promoted-common.conf;
        proxy_set_header Host $time_tracker_ha_canonical_host;
    }
}

server {
    listen 443 ssl;
    server_name timer.ehzsy.site;
    ssl_certificate /etc/letsencrypt/live/ehzsy.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ehzsy.site/privkey.pem;
    client_max_body_size 4m;
    include /etc/nginx/time-tracker-ha/pwa.conf;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { proxy_pass http://127.0.0.1:18000; include /etc/nginx/time-tracker-ha/proxy-promoted-common.conf; proxy_set_header Host timer.ehzsy.site; }
}

server {
    listen 443 ssl;
    server_name drill.ehzsy.site;
    ssl_certificate /etc/letsencrypt/live/drill.ehzsy.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drill.ehzsy.site/privkey.pem;
    client_max_body_size 4m;
    include /etc/nginx/time-tracker-ha/pwa.conf;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    # RainYun handles this internal redirect after Django has authorized the token.
    location ^~ /share/learning/ {
        error_log /dev/null crit;
        access_log off;
        proxy_pass http://127.0.0.1:18000;
        include /etc/nginx/time-tracker-ha/proxy-promoted-common.conf;
        proxy_set_header Host drill.ehzsy.site;
        proxy_ignore_headers X-Accel-Redirect;
        proxy_pass_header X-Accel-Redirect;
    }
    location / { proxy_pass http://127.0.0.1:18000; include /etc/nginx/time-tracker-ha/proxy-promoted-common.conf; proxy_set_header Host drill.ehzsy.site; }
}

server {
    listen 443 ssl;
    server_name ei.ehzsy.site;
    ssl_certificate /etc/letsencrypt/live/ei.ehzsy.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ei.ehzsy.site/privkey.pem;
    client_max_body_size 4m;
    include /etc/nginx/time-tracker-ha/pwa.conf;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location ^~ /share/learning/ {
        error_log /dev/null crit;
        access_log off;
        proxy_pass http://127.0.0.1:18000;
        include /etc/nginx/time-tracker-ha/proxy-promoted-common.conf;
        proxy_set_header Host ei.ehzsy.site;
        proxy_ignore_headers X-Accel-Redirect;
        proxy_pass_header X-Accel-Redirect;
    }
    location / { proxy_pass http://127.0.0.1:18000; include /etc/nginx/time-tracker-ha/proxy-promoted-common.conf; proxy_set_header Host ei.ehzsy.site; }
}
