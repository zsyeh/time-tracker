<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c0f" />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" type="image/png" sizes="180x180" href="/icon-180.png?v=img9387" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png?v=img9387" />
    <script>
      try {
        const savedTheme = localStorage.getItem('learning-os-theme') || 'violet'
        document.documentElement.dataset.theme = savedTheme
      } catch (_) { document.documentElement.dataset.theme = 'violet' }
    </script>
    <title>Personal Learning OS</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
